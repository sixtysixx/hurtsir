name: Setup exe

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
    paths:
      - "tools/sirhurt-setup/**"
      - ".github/workflows/setup-exe.yml"
  pull_request:
    paths:
      - "tools/sirhurt-setup/**"
      - ".github/workflows/setup-exe.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Tag to publish (leave empty to build without releasing)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: setup-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read setup version
        id: version
        shell: pwsh
        run: |
          $pattern = '^__version__ = "([^"]+)"$'
          $match = Select-String -Path tools/sirhurt-setup/setup.py -Pattern $pattern |
            Select-Object -First 1
          if (-not $match) { throw "no __version__ line in tools/sirhurt-setup/setup.py" }
          $version = $match.Matches[0].Groups[1].Value
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
          Write-Host "setup version: $version (tag v$version)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Unit tests
        run: python -m unittest discover -s tools/sirhurt-setup -p "test_*.py" -v

      - name: Install Nuitka
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka==4.2.1" zstandard ordered-set

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('tools/sirhurt-setup/setup.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/sirhurt-setup/build.ps1

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "tools/sirhurt-setup/build/SixSirhurtUnretardifier9000Pro.exe").Path
          if (-not (Test-Path $exe)) { throw "build produced no exe" }

          $process = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "--version exited with code $($process.ExitCode)"
          }
          Write-Host "version check: exit 0"

          $text = [Text.Encoding]::GetEncoding(28591).GetString([IO.File]::ReadAllBytes($exe))
          if ($text -notmatch 'requestedExecutionLevel level="requireAdministrator"') {
            throw "the exe does not carry the requireAdministrator manifest"
          }
          Write-Host "manifest check: requireAdministrator present"

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash *SixSirhurtUnretardifier9000Pro.exe" |
            Out-File "tools/sirhurt-setup/build/SHA256SUMS.txt" -Encoding ascii
          Write-Host "sha256: $hash"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SixSirhurtUnretardifier9000Pro-${{ github.sha }}
          path: |
            tools/sirhurt-setup/build/SixSirhurtUnretardifier9000Pro.exe
            tools/sirhurt-setup/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    # Tag pushes, published releases, an explicit dispatch tag, and plain main
    # pushes (which publish v<__version__> unless that release already exists).
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
            github.event_name == 'release' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.release != '') ||
            (github.event_name == 'push' &&
             (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'))
          ) }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: SixSirhurtUnretardifier9000Pro-${{ github.sha }}
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SixSirhurtUnretardifier9000Pro.exe

      # Optional: add WINDOWS_CERT_PFX (base64 .pfx) and WINDOWS_CERT_PASSWORD
      # as repository secrets, then uncomment this step to sign the exe.
      # - name: Sign
      #   shell: pwsh
      #   run: |
      #     $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}"))
      #     & signtool sign /f $pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
      #       /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
      #       dist/SixSirhurtUnretardifier9000Pro.exe

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          if ($event -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } elseif ($event -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.release }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v${{ needs.build.outputs.version }}"
          }
          if (-not $tag) { throw "could not resolve a release tag" }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`n")
          Write-Host "release tag: $tag"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { throw "no release tag resolved" }

          $fromMain = ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main')

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            if ($fromMain) {
              Write-Host "release $tag already exists (setup version unchanged); nothing to publish"
              exit 0
            }
            Write-Host "release $tag exists; uploading assets"
            gh release upload $tag `
              dist/SixSirhurtUnretardifier9000Pro.exe `
              dist/SHA256SUMS.txt `
              --repo "$env:GITHUB_REPOSITORY" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          } else {
            Write-Host "creating release $tag"
            gh release create $tag `
              dist/SixSirhurtUnretardifier9000Pro.exe `
              dist/SHA256SUMS.txt `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title $tag `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
